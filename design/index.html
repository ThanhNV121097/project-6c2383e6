<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World Acceptance 6</title>
  <style>
    :root {
      --background: #FFFFFF;
      --text: #000000;
      --primary: #2563EB;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: 100%;
      padding: 24px;
    }

    .greeting-section {
      width: min(100%, 560px);
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(40px, 8vw, 72px);
      line-height: 1.05;
      font-weight: 700;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    form {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: stretch;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 2px solid var(--text);
      border-radius: 0;
      padding: 14px 16px;
      font: inherit;
      font-size: 18px;
      color: var(--text);
      background: var(--background);
    }

    button {
      border: 2px solid var(--primary);
      border-radius: 0;
      padding: 14px 22px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      color: var(--background);
      background: var(--primary);
      cursor: pointer;
    }

    input:focus,
    button:focus {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    button:hover {
      background: var(--primary);
      color: var(--background);
    }

    .status {
      min-height: 24px;
      margin: 12px 0 0;
      font-size: 16px;
      color: var(--text);
    }

    @media (max-width: 520px) {
      form {
        flex-direction: column;
      }

      button,
      input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="greeting-section" aria-labelledby="greeting">
      <h1 id="greeting">Hello, World!</h1>
      <form id="greeting-form" novalidate>
        <label for="greeting-input">Greeting</label>
        <input id="greeting-input" name="greeting" type="text" value="Hello, World!" autocomplete="off" required>
        <button type="submit">Save</button>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const form = document.getElementById('greeting-form');
    const input = document.getElementById('greeting-input');
    const heading = document.getElementById('greeting');
    const status = document.getElementById('status');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const nextGreeting = input.value.trim();

      if (!nextGreeting) {
        status.textContent = 'Enter a greeting.';
        input.focus();
        return;
      }

      heading.textContent = nextGreeting;
      input.value = nextGreeting;
      status.textContent = 'Saved.';
    });
  </script>
</body>
</html>
